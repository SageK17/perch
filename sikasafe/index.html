<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SikaSafe — Guard your MoMo from scams</title>
<meta name="description" content="A free, offline tool that helps you spot mobile money (MoMo) scams in Ghana before you lose money. Check messages, learn the tricks, and know who to call.">
<meta name="theme-color" content="#0b6b46">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="logo" aria-hidden="true"><use href="#i-shield"/></svg>
    <div>
      <div class="brand-name">Sika<span>Safe</span></div>
      <p id="tagline" class="brand-tag"></p>
    </div>
  </div>
  <div id="lang" class="lang" role="group" aria-label="Language"></div>
</header>

<main>
  <section class="view" data-view="check" id="view-check"></section>
  <section class="view" data-view="learn" id="view-learn" hidden></section>
  <section class="view" data-view="report" id="view-report" hidden></section>
  <section class="view" data-view="help" id="view-help" hidden></section>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="navbtn is-active" data-view="check"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><span class="navlabel">Check</span></button>
  <button class="navbtn" data-view="learn"><svg class="ic" aria-hidden="true"><use href="#i-book"/></svg><span class="navlabel">Learn</span></button>
  <button class="navbtn" data-view="report"><svg class="ic" aria-hidden="true"><use href="#i-flag"/></svg><span class="navlabel">Reports</span></button>
  <button class="navbtn" data-view="help"><svg class="ic" aria-hidden="true"><use href="#i-lifebuoy"/></svg><span class="navlabel">Help</span></button>
</nav>

<div id="toast" class="toast" role="status" hidden></div>
